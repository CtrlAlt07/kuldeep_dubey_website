<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;700&amp;family=Tiro+Devanagari+Hindi&amp;display=swap');
      
      .primary-text {
        font-family: 'Tiro Devanagari Hindi', serif;
        font-size: 44px;
        fill: #7C2D12;
      }
      
      .secondary-text {
        font-family: 'Noto Sans Devanagari', sans-serif;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        fill: #D97706;
      }
    </style>
  </defs>
  
  <!-- Subtle spiritual background glow / sunburst -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="45" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.35" />
    <circle cx="50" cy="50" r="38" fill="none" stroke="#D97706" stroke-width="0.75" stroke-dasharray="1 3" opacity="0.25" />
    
    <!-- Traditional Tilak Symbol -->
    <!-- Left Prong -->
    <path d="M 35,15 Q 35,65 50,85 Q 40,65 40,15 Z" fill="#D97706" />
    <!-- Right Prong -->
    <path d="M 65,15 Q 65,65 50,85 Q 60,65 60,15 Z" fill="#D97706" />
    <!-- Central Red/Rust Teardrop -->
    <path d="M 50,25 C 47,45 46,60 46,65 C 46,70 48,72 50,72 C 52,72 54,70 54,65 C 54,60 53,45 50,25 Z" fill="#7C2D12" />
    <!-- Base Bindu -->
    <circle cx="50" cy="90" r="3.5" fill="#FBBF24" />
  </g>
  
  <!-- Text Elements -->
  <text x="135" y="62" class="primary-text">पं. कुलदीप दुबे</text>
  <text x="138" y="94" class="secondary-text">Vedic Priest • Ujjain</text>
</svg>
